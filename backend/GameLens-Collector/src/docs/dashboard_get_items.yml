doc: "Get item analytics for a game and optional version"
tags:
  - Dashboard
parameters:
  - name: game_name
    in: query
    type: string
    required: true
    description: Game name scoped to the requesting user
    example: "Hades"
  - name: version_name
    in: query
    type: string
    required: false
    description: Optional version filter; omit for cross-version aggregation
    example: "1.0.0"
  - name: user_id
    in: query
    type: integer
    required: false
    description: User id if X-User-ID header is not provided
    example: 1
  - name: X-User-ID
    in: header
    type: integer
    required: false
    description: Preferred user id source
    example: 1
responses:
  200:
    description: Item analytics list
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 5
          name:
            type: string
            example: "Athena Boon"
          popularity:
            type: number
            format: float
            nullable: true
            example: 57.14
          impact:
            type: string
            nullable: true
            enum: [High, Medium, Low]
            example: "Medium"
          category:
            type: string
            nullable: true
            example: null
          logicTag:
            type: string
            nullable: true
            example: null
          rarity:
            type: string
            nullable: true
            example: null
          avgPossessionMinutes:
            type: number
            format: float
            nullable: true
            example: 2.43
  400:
    description: Missing/invalid query params or DB/runtime error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Client Side Error"
        message:
          type: string
          example: "game_name is required"
        type:
          type: string
          example: "MissingCollectorParam"
  404:
    description: Game not found for the provided user and game name
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Game not found"
