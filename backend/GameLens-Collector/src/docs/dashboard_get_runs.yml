doc: "Get run history and boss encounters for a game and optional version"
tags:
  - Dashboard
parameters:
  - name: game_name
    in: query
    type: string
    required: true
    description: Game name scoped to the requesting user
    example: "Hades"
  - name: version_name
    in: query
    type: string
    required: false
    description: Optional version filter; omit for cross-version history
    example: "1.0.0"
  - name: user_id
    in: query
    type: integer
    required: false
    description: User id if X-User-ID header is not provided
    example: 1
  - name: X-User-ID
    in: header
    type: integer
    required: false
    description: Preferred user id source
    example: 1
responses:
  200:
    description: Run history list
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 101
          date:
            type: string
            format: date
            example: "2026-01-15"
          duration:
            type: string
            example: "00:20:40"
          outcome:
            type: string
            enum: [death, win]
            example: "win"
          bossEncounters:
            type: array
            items:
              type: object
              properties:
                bossId:
                  type: integer
                  example: 7
                lifespan:
                  type: string
                  example: "01:10"
                loadout:
                  type: array
                  items:
                    type: integer
                  example: [5, 8, 11]
  400:
    description: Missing/invalid query params or DB/runtime error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Client Side Error"
        message:
          type: string
          example: "game_name is required"
        type:
          type: string
          example: "MissingCollectorParam"
  404:
    description: Game not found for the provided user and game name
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Game not found"
