doc: "Get aggregated dashboard KPIs for a game and optional version"
tags:
  - Dashboard
parameters:
  - name: game_name
    in: query
    type: string
    required: true
    description: Game name scoped to the requesting user
    example: "Hades"
  - name: version_name
    in: query
    type: string
    required: false
    description: Optional version filter; omit for cross-version aggregation
    example: "1.0.0"
  - name: user_id
    in: query
    type: integer
    required: false
    description: User id if X-User-ID header is not provided
    example: 1
  - name: X-User-ID
    in: header
    type: integer
    required: false
    description: Preferred user id source
    example: 1
responses:
  200:
    description: Aggregated dashboard stats
    schema:
      type: object
      properties:
        totalRuns:
          type: integer
          example: 42
        avgDuration:
          type: string
          nullable: true
          example: "00:19:31"
        longestRun:
          type: string
          nullable: true
          example: "00:42:10"
        bossKillPercent:
          type: number
          format: float
          example: 67.5
        mostPopularItem:
          type: string
          nullable: true
          example: "Athena Boon"
  400:
    description: Missing/invalid query params or DB/runtime error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Client Side Error"
        message:
          type: string
          example: "game_name is required"
        type:
          type: string
          example: "MissingCollectorParam"
  404:
    description: Game not found for the provided user and game name
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Game not found"
